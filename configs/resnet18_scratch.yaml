experiment_name: resnet18_scratch
seed: 42

data:
  num_classes: 500
  train_per_class: 40
  validation_per_class: 10
  test_per_class: 10
  image_size: 224
  batch_size: 64
  num_workers: 2

model:
  architecture: resnet18
  pretrained: false

training:
  epochs: 60
  optimizer: sgd
  learning_rate: 0.05
  momentum: 0.9
  weight_decay: 0.0001
  label_smoothing: 0.1
  early_stopping_patience: 12
  use_amp: true

scheduler:
  name: cosine
  minimum_learning_rate: 0.00001

