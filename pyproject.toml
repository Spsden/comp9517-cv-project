[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp9517-inat"
version = "0.1.0"
description = "Shared code for the COMP9517 iNaturalist group project"
requires-python = ">=3.10"

[project.scripts]
inat-prepare = "inat_project.local_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
